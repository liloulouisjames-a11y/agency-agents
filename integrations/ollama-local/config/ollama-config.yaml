# Ollama Server Configuration
# Copy this file to your project and adjust settings as needed

server:
  # Server endpoint
  host: localhost
  port: 11434
  base_url: http://localhost:11434
  api_version: v1

# Default model configuration
models:
  # Primary model for general use
  default: mistral

  # Fallback model if primary is not available
  fallback: neural-chat

  # Model-specific settings
  mistral:
    name: mistral
    description: "Fast, high-quality general-purpose model"
    size: 4.1GB
    params:
      temperature: 0.7
      top_p: 0.9
      top_k: 40
      num_predict: 512
      repeat_penalty: 1.1

  neural-chat:
    name: neural-chat
    description: "Optimized for conversational tasks"
    size: 3.8GB
    params:
      temperature: 0.7
      top_p: 0.9
      top_k: 40
      num_predict: 512

  codellama:
    name: codellama
    description: "Specialized for code generation and analysis"
    size: 3.8GB
    params:
      temperature: 0.2
      top_p: 0.95
      top_k: 40
      num_predict: 1024

  dolphin-mixtral:
    name: dolphin-mixtral
    description: "Advanced reasoning and complex tasks"
    size: 26GB
    params:
      temperature: 0.7
      top_p: 0.9
      top_k: 40
      num_predict: 2048

# Performance tuning
performance:
  # CPU configuration
  cpu:
    num_threads: 8
    num_parallel: 1

  # GPU configuration (if available)
  gpu:
    enabled: false
    num_gpu: 0

  # Memory management
  memory:
    keep_alive: 5m
    context_window: 2048

# Request defaults
requests:
  timeout: 300
  stream: false
  temperature: 0.7
  top_p: 0.9
  top_k: 40
  num_predict: 512

# Logging configuration
logging:
  level: info
  format: json
  file: logs/ollama.log

# Health check configuration
health:
  check_interval: 30
  timeout: 5
  retry_attempts: 3
