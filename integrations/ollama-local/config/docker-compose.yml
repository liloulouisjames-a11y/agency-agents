version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-local

    # Expose API endpoint
    ports:
      - "11434:11434"

    # Mount volume for model persistence
    volumes:
      - ollama_data:/root/.ollama
      - ./config:/config:ro

    # Environment variables
    environment:
      - OLLAMA_KEEP_ALIVE=5m
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_DEBUG=false

    # GPU support (uncomment if using NVIDIA)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Restart policy
    restart: unless-stopped

    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Resource limits (adjust based on your hardware)
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '4'
    #       memory: 8G
    #     reservations:
    #       cpus: '2'
    #       memory: 4G

volumes:
  ollama_data:
    driver: local

networks:
  default:
    name: ollama-network
    driver: bridge
